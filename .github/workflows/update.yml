name: Patch latest Nuvio Enhanced

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  UPSTREAM: luqmanfadlli/NuvioMobile-Enhanced

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest upstream release with an IPA
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$UPSTREAM/releases?per_page=20" > releases.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          for r in json.load(open("releases.json")):
              if r.get("draft"):
                  continue
              ipa = next((a for a in r["assets"] if a["name"].lower().endswith(".ipa")), None)
              if ipa:
                  print(f"tag={r['tag_name']}")
                  print(f"url={ipa['browser_download_url']}")
                  break
          PY

      - name: Skip if already done
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${{ steps.up.outputs.tag }}" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh release view "${{ steps.up.outputs.tag }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and patch
        id: patch
        if: steps.check.outputs.skip == 'false'
        run: |
          curl -fsSL -o upstream.ipa "${{ steps.up.outputs.url }}"
          VERSION=$(python3 - <<'PY'
          import plistlib, zipfile
          z = zipfile.ZipFile("upstream.ipa")
          p = next(n for n in z.namelist() if n.count("/") == 2 and n.endswith(".app/Info.plist"))
          print(plistlib.loads(z.read(p)).get("CFBundleShortVersionString", "latest"))
          PY
          )
          OUT="Nuvio-Enhanced-${VERSION}.ipa"
          python3 scripts/patch_ipa.py upstream.ipa "dist/$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.up.outputs.tag }}" "dist/${{ steps.patch.outputs.out }}" \
            -R "$GITHUB_REPOSITORY" \
            --title "Nuvio Enhanced ${{ steps.patch.outputs.version }}" \
            --notes "Full screen fix. Source: ${{ steps.up.outputs.url }}" \
            --latest
